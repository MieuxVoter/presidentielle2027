name: LLM mining

# Une issue new-poll est dépouillée automatiquement en PR brouillon ; /triage
# conserve le tri léger, et /mining-pr permet de relancer le dépouillement.
# Une personne doit toujours relire la PR avant de la rendre prête à fusionner.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Numéro de l'issue à (re)traiter"
        required: true
        type: string
      mode:
        description: "Action à exécuter"
        required: true
        default: mining-pr
        type: choice
        options:
          - mining-pr
          - triage

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: llm-mining-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  mining:
    # Filtre grossier : la commande est réservée aux personnes ayant les droits
    # d'écriture, sinon n'importe qui peut vider le quota d'API en commentant.
    # Le test précis de la commande est fait par la première étape.
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'new-poll')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/triage') || contains(github.event.comment.body, '/mining-pr')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      # Choisit le mode pour tous les déclencheurs : sans cette étape, une issue
      # ouverte n'aurait pas de mode et ne recevrait jamais de PR.
      # Les commandes doivent ouvrir une ligne. Le corps passe par
      # l'environnement, jamais dans le script (injection de shell).
      - name: Vérifier la commande
        id: command
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "issue_comment" ]; then
            if printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*/mining-pr([[:space:]]|$)'; then
              echo "mode=mining-pr" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*/triage([[:space:]]|$)'; then
              echo "mode=triage" >> "$GITHUB_OUTPUT"
            else
              echo "Pas de commande reconnue en début de ligne, rien à faire."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
          else
            echo "mode=mining-pr" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.command.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.command.outputs.skip != 'true'
        with:
          python-version: "3.13"

      # Nécessaire au repli PDF : l'amont ne publie de version texte que depuis
      # peu, et pas rétroactivement.
      - name: Installer les dépendances de mining et de vérification
        if: steps.command.outputs.skip != 'true'
        run: pip install -r requirements_mining.txt -r requirements_pytests.txt

      # Sans clé d'API, on sort en silence plutôt que de faire échouer l'issue.
      - name: Vérifier la présence d'une clé
        id: guard
        if: steps.command.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY$MISTRAL_API_KEY$GEMINI_API_KEY" ]; then
            echo "::warning::Aucune clé LLM configurée, mining ignoré."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Miner la notice et créer la PR brouillon
        if: steps.command.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          MODE: ${{ steps.command.outputs.mode }}
          # Logs dans l'ordre, sans tampon : c'est la seule trace quand la publication échoue.
          PYTHONUNBUFFERED: "1"
          FORCE: ${{ github.event_name != 'issues' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=(--issue "$ISSUE" --post)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$MODE" = "mining-pr" ]; then args+=(--pr); fi
          python mine_poll.py "${args[@]}"
